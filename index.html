<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b21e35">
  <title>海德认证 审核计划辅助系统</title>
  <link rel="stylesheet" href="styles.css?v=20260916-plan-optimization">
  <link rel="icon" href="assets/head-certification-logo.png" type="image/png">
</head>
<body>
  <div class="app-shell">
    <aside class="app-rail" aria-label="主导航">
      <div class="rail-logo" title="海德认证"><img src="assets/head-certification-logo.png" alt="海德认证"></div>
      <nav class="rail-nav" aria-label="模块导航">
        <button class="rail-item is-active" type="button" aria-label="首页" title="首页"><i data-lucide="house"></i></button>
        <button class="rail-item" type="button" aria-label="计划" title="计划"><i data-lucide="calendar-days"></i></button>
        <button class="rail-item" type="button" aria-label="文档" title="文档"><i data-lucide="files"></i></button>
        <button class="rail-item" type="button" aria-label="审核" title="审核"><i data-lucide="shield-check"></i></button>
        <button class="rail-item" type="button" aria-label="人员" title="人员"><i data-lucide="users"></i></button>
        <button class="rail-item" type="button" aria-label="统计" title="统计"><i data-lucide="chart-no-axes-combined"></i></button>
        <button class="rail-item" type="button" aria-label="设置" title="设置"><i data-lucide="settings"></i></button>
      </nav>
      <button class="rail-collapse" type="button" aria-label="收起导航" title="收起导航"><i data-lucide="chevron-left"></i></button>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="title-stack">
          <div class="title-row">
            <img class="mobile-brand-logo" src="assets/head-certification-logo.png" alt="">
            <h1><span class="brand-name">海德认证</span> <span>审核计划辅助系统</span></h1>
          </div>
        </div>
        <div class="header-tools">
          <label class="search-box" aria-label="搜索">
            <i data-lucide="search" aria-hidden="true"></i>
            <input type="search" placeholder="搜索项目、部门或条款...">
            <kbd>⌘ K</kbd>
          </label>
          <button class="icon-button has-dot" type="button" aria-label="通知" title="通知"><i data-lucide="bell"></i></button>
          <button class="icon-button" type="button" aria-label="帮助" title="帮助"><i data-lucide="circle-help"></i></button>
          <button class="avatar-button" type="button" aria-label="用户菜单" title="用户菜单"><i data-lucide="user-round"></i></button>
        </div>
      </header>

      <main class="workspace">
        <section class="command-strip">
          <section id="plan-file-dropzone" class="notice-panel import-panel" aria-label="加载实施计划表格" aria-busy="false">
            <input id="notice-file" type="file" accept=".xlsx,.pdf,.txt" hidden>
            <div class="import-header">
              <button id="btn-import" class="import-trigger" type="button" title="拖入 Excel 表格，或点击选择文件" aria-label="加载实施计划表格，支持拖入 Excel 或点击选择"><i data-lucide="upload" aria-hidden="true"></i><span>加载实施计划表格</span></button>
              <span id="import-status" class="import-status" role="status" hidden></span>
            </div>
          <details class="compact-notice">
            <summary>
              <span>
                <span>
                  <span id="notice-summary">Excel · .xlsx</span>
                  <span id="system-profile" class="system-profile" aria-label="项目体系组合"></span>
                </span>
              </span>
              <span class="tag">项目信息<i data-lucide="chevron-down" aria-hidden="true"></i></span>
            </summary>
            <div class="form-grid">
              <label>
                受审核方
                <input id="company" type="text" value="示例企业（演示）">
              </label>
              <label>
                审核类型
                <select id="audit-type">
                  <option>初次认证第一阶段</option>
                  <option selected>初次认证第二阶段</option>
                  <option>监督审核</option>
                  <option>再认证审核</option>
                  <option>特殊审核</option>
                  <option>专项审核</option>
                  <option>短通审核</option>
                  <option>补充审核</option>
                  <option>转换前现场访问</option>
                </select>
              </label>
              <label>
                开始日期
                <input id="start-date" type="date" value="2026-08-25">
              </label>
              <label>
                审核天数
                <input id="audit-days" type="number" min="1" max="60" step="1" value="2">
              </label>
              <label>
                总审核人日
                <input id="person-days" type="number" min="0.5" max="200" step="0.01" value="4.0">
              </label>
              <label>首日开始时间<input id="audit-start-time" type="time" value="08:30"></label>
              <label>末日结束时间<input id="audit-end-time" type="time" value="17:00"></label>
              <label>午休时长（小时）<input id="lunch-hours" type="number" min="0" max="3" step="0.25" value="1"></label>
              <label>倒班审核时长（小时）<input id="shift-hours" type="number" min="0" max="8" step="0.5" value="0"></label>
              <label>倒班审核日期<input id="shift-date" type="date"></label>
              <label>倒班开始时间<input id="shift-start" type="time"></label>
              <label>环境体系版本<select id="ems-version"><option value="2026">ISO 14001:2026</option><option value="2015">ISO 14001:2015</option></select></label>
              <label>
                编排模式
                <select id="team-mode">
                  <option value="parallel" selected>按人员分组</option>
                  <option value="together">审核组同行</option>
                </select>
              </label>
              <label class="wide-field">
                认证范围
                <textarea id="scope" rows="2">示例产品的生产和销售</textarea>
              </label>
            </div>
          </details>
          </section>
          <div class="top-actions">
            <button id="btn-suggest" class="btn" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>重置建议</button>
            <button id="btn-schedule" class="btn btn-primary" type="button"><i data-lucide="calendar-days" aria-hidden="true"></i>生成日程</button>
            <button id="btn-preview" class="btn" type="button" aria-haspopup="dialog" aria-controls="plan-preview"><i data-lucide="eye" aria-hidden="true"></i>预览</button>
            <button id="btn-print" class="btn" type="button"><i data-lucide="printer" aria-hidden="true"></i>打印</button>
          </div>
        </section>

      <section class="board-layout" aria-label="条款和部门编排">
        <aside class="phase-panel">
          <div class="section-heading">
            <h2>审核阶段</h2>
            <span id="phase-summary" class="tag">二阶段</span>
          </div>
          <div class="phase-list">
            <button class="phase-card" type="button" data-phase-id="stage1">
              <span class="phase-card-title">一阶段审核计划</span>
              <span class="phase-card-meta">文件评审 / 现场准备 / 范围确认</span>
              <span class="phase-card-foot">建议 1 天 / 2.0 人日</span>
            </button>
            <button class="phase-card is-active" type="button" data-phase-id="stage2">
              <span class="phase-card-title">二阶段审核计划</span>
              <span class="phase-card-meta">部门审核 / 条款覆盖 / 专业确认</span>
              <span class="phase-card-foot">建议 2 天 / 4.0 人日</span>
            </button>
          </div>
          <div class="legend phase-legend">
            <span><b class="dot common"></b>通用</span>
            <span><b class="dot professional"></b>专业</span>
            <span><b class="dot conditional"></b>适用性</span>
          </div>
          <div id="unassigned-section" hidden>
            <h3>待分配条款</h3>
            <div id="unassigned-clauses" class="clause-list drop-area" data-dept-id="unassigned"></div>
          </div>
        </aside>

        <section class="department-area">
          <div class="section-heading">
            <h2>部门框</h2>
            <span id="active-phase-label" class="tag">二阶段审核计划</span>
            <div class="add-dept">
              <input id="new-dept-name" type="text" placeholder="新增部门">
              <button id="btn-add-dept" class="btn" type="button">添加</button>
            </div>
          </div>
          <div id="department-board" class="department-board"></div>
        </section>

        <aside class="side-panel">
          <section aria-labelledby="team-title">
            <div class="section-heading">
              <h2 id="team-title">审核组</h2>
              <button id="btn-add-auditor" class="btn" type="button">添加人员</button>
            </div>
            <div id="auditor-list" class="auditor-list"></div>
          </section>

          <section aria-labelledby="check-title">
            <div class="section-heading">
              <h2 id="check-title">覆盖检查</h2>
              <span id="check-summary" class="tag">待检查</span>
            </div>
            <div class="metrics">
              <div>
                <span class="metric-value" id="covered-count">0</span>
                <span class="metric-label">已覆盖</span>
              </div>
              <div>
                <span class="metric-value" id="missing-count">0</span>
                <span class="metric-label">未分配</span>
              </div>
              <div>
                <span class="metric-value" id="professional-count">0</span>
                <span class="metric-label">专业风险</span>
              </div>
            </div>
            <ul id="issues-list" class="issues-list"></ul>
            <p id="system-coverage" class="system-coverage"></p>
          </section>

          <section aria-labelledby="specialty-title">
            <div class="section-heading">
              <h2 id="specialty-title">专业条款策略</h2>
              <span id="specialty-summary" class="tag">单Q</span>
            </div>
            <div id="professional-strategy" class="strategy-list"></div>
          </section>
        </aside>
      </section>

      <section class="plan-output" aria-labelledby="output-title">
        <h2 id="output-title">审核计划输出</h2>
        <button id="btn-download-word" class="word-download-card" type="button" aria-describedby="word-download-status">
          <span class="word-file-icon"><i data-lucide="file-text" aria-hidden="true"></i></span>
          <span class="word-download-copy"><strong>下载 Word</strong><span>审核实施计划 · DOCX</span></span>
          <span id="word-download-status" class="word-download-status" role="status">待确认</span>
          <i data-lucide="download" aria-hidden="true"></i>
        </button>
      </section>

      <section class="schedule-panel" aria-labelledby="schedule-title">
        <div class="section-heading">
          <h2 id="schedule-title">审核日程预览</h2>
          <span id="hours-summary" class="tag">未生成</span>
        </div>
        <div class="table-wrap">
          <table class="schedule-table">
            <thead>
              <tr>
                <th>日期</th>
                <th>时间</th>
                <th>部门/过程</th>
                <th>条款</th>
                <th>审核人员</th>
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
      </section>
      </main>
    </div>
  </div>

  <dialog id="plan-preview" class="plan-preview" aria-labelledby="preview-title">
    <header class="preview-toolbar">
      <div class="preview-heading">
        <h2 id="preview-title">审核计划预览</h2>
        <span class="preview-format">海德标准表 · A4 纵向</span>
      </div>
      <div class="preview-actions">
        <button id="btn-preview-close" class="btn" type="button" autofocus><i data-lucide="arrow-left" aria-hidden="true"></i>返回编辑</button>
        <button id="btn-preview-word" class="btn" type="button"><i data-lucide="download" aria-hidden="true"></i>导出 Word</button>
        <button id="btn-preview-print" class="btn btn-primary" type="button"><i data-lucide="printer" aria-hidden="true"></i>打印</button>
      </div>
    </header>
    <div id="preview-scroll" class="preview-scroll" tabindex="0" aria-label="审核计划正文">
      <div id="preview-content"></div>
    </div>
  </dialog>
  <div id="print-content" aria-hidden="true"></div>

  <script src="vendor/jszip/jszip.min.js"></script>
  <script src="vendor/lucide/lucide.min.js"></script>
  <script src="haide-fields.js"></script>
  <script src="haide-template.js"></script>
  <script src="haide-plan.js?v=20260916-plan-optimization"></script>
  <script src="audit-rules.js"></script>
  <script src="plan-content.js?v=20260916-plan-optimization"></script>
  <script src="plan-meetings.js?v=20260916-plan-optimization"></script>
  <script src="app.js?v=20260916-plan-optimization"></script>
</body>
</html>
